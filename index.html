<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>kzzzl's geography game</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Source+Code+Pro:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/400.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5/700.css" rel="stylesheet" />
    <style>
      /* Critical loading-screen styles, inlined so the screen paints before the CSS bundle. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg, #1a1b26);
        color: var(--text, #c0caf5);
        transition: opacity 0.4s ease;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }
      .loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        max-width: 100%;
        text-align: center;
      }
      #loader-ascii {
        margin: 0;
        font-family: 'Iosevka', ui-monospace, monospace;
        font-size: min(0.9rem, calc((100vw - 8rem) / 43));
        line-height: 1.15;
        white-space: pre;
        overflow: hidden;
        max-width: 100%;
        color: var(--text-muted, #969dbd);
        opacity: 0.85;
      }
      .loader-ring {
        position: relative;
        width: 48px;
        height: 48px;
      }
      .loader-ring span {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: var(--primary, #7aa2f7);
        transform: rotate(calc(var(--i) * 30deg)) translateY(-19px);
        animation: loader-dot 1.2s linear infinite;
        animation-delay: calc(var(--i) * -0.1s);
        opacity: 0.15;
      }
      @keyframes loader-dot {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
      .loader-status {
        margin: 0;
        font-size: 0.9rem;
        color: var(--text, #c0caf5);
      }
      .loader-skip {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.5rem 1.5rem;
        border-radius: 6px;
        border: 1px solid var(--border, #3b4261);
        background: var(--bg-elev, #2f334d);
        color: var(--text, #c0caf5);
        cursor: pointer;
      }
      .loader-skip:hover { border-color: var(--primary, #7aa2f7); }
      .loader-note {
        margin: 0;
        max-width: 24rem;
        font-size: 0.75rem;
        color: var(--text-muted, #969dbd);
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-ring span { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
      <div class="loader-inner">
        <pre id="loader-ascii" aria-hidden="true"></pre>
        <div class="loader-ring" aria-hidden="true">
          <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span>
          <span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span>
          <span style="--i:6"></span><span style="--i:7"></span><span style="--i:8"></span>
          <span style="--i:9"></span><span style="--i:10"></span><span style="--i:11"></span>
        </div>
        <p class="loader-status" id="loader-status">Loading&hellip;</p>
        <button type="button" class="loader-skip" id="loader-skip">Skip</button>
        <p class="loader-note" id="loader-note">Skipping may leave fonts, maps, and images unavailable.</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
